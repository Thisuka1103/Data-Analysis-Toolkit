[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data_analysis"
version = "0.1.0"
authors = [
  { name="Thisuka Sanvidu", email="tsanvidu53@gmail.com" },
]
description = "A Modular Data Sanitization & Exploration Engine"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy<2",
    "plotly",
    "scipy",
    "scikit-learn",
    "ipython"
]

[project.urls]
"Homepage" = "https://github.com/Thisuka1103/Data-Analysis-Toolkit"
