[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"
 
[project]
name = "data-analysis-tool"
version = "0.1.0"
description = "Modular Data Sanitization and Exploration Engine"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "networkx",
]
 
[tool.setuptools.packages.find]
where = ["."]
include = ["data_analysis*"]
